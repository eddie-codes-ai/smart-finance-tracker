# Gradle JVM sizing.
#
# This previously asked for -Xmx8G with a 4G metaspace - 12GB of reservations
# on a 16GB machine - so the daemon could not get the memory it had been
# promised and died mid-build with "Gradle build daemon disappeared
# unexpectedly" (see the hs_err_pid*.log files it left behind). A Flutter
# Android build is comfortable in 3G, which also leaves room for the Dart
# compiler, the emulator and the editor to run alongside it.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
