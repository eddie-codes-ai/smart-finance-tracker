name: frontend
description: Smart Personal Finance Tracker - Flutter Frontend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests to Flask backend
  http: ^1.2.0

  # Secure JWT token storage on device
  flutter_secure_storage: ^9.0.0

  # Charts - pie and bar graphs
  fl_chart: ^0.66.2

  # State management
  provider: ^6.1.2

  # PIN / biometric authentication
  local_auth: ^2.2.0

  # Local push notifications for smart alerts
  flutter_local_notifications: ^17.0.0

  # Date formatting
  intl: ^0.19.0

  # Default Flutter icon package
  cupertino_icons: ^1.0.2

  # M-Pesa SMS inbox reader (Tab 1 — reads SMS directly from phone)
  flutter_sms_inbox: ^1.0.4

  # Handles READ_SMS permission dialog at runtime
  permission_handler: ^11.3.1

  # Stores recipient→category memory locally on device
  shared_preferences: ^2.2.3

  # Google Sign-In
  google_sign_in: ^6.2.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true