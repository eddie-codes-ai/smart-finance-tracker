name: frontend
description: Smart Personal Finance Tracker - Flutter Frontend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests to Flask backend
  http: ^1.2.0

  # Secure JWT token storage on device
  flutter_secure_storage: ^9.0.0

  # Charts - pie and bar graphs
  fl_chart: ^0.66.2

  # State management
  provider: ^6.1.2

  # PIN / biometric authentication
  local_auth: ^2.2.0

  # Local push notifications for smart alerts
  flutter_local_notifications: ^17.0.0

  # Date formatting
  intl: ^0.19.0

  # Default Flutter icon package
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true